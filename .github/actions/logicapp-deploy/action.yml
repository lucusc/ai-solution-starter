name: "Deploy to Azure Logic Apps"
description: "Deploy to Azure Logic Apps"
inputs:
  resource-group:
    description: "The name of the resource group to deploy to"
    required: true
  logicapp-name:
    description: "The name of the Logic App to deploy to"
    required: true
  package:
    description: "The path to the package to deploy"
    required: false
runs:
  using: composite
  steps:
    - name: Get Runner IP
      id: get-ip
      uses: ./.github/actions/my-ip-address

    - name: Allow Runner IP Temporarily
      uses: azure/cli@v2.1.0
      env:
        LOGIC_APP_NAME: ${{ inputs.logicapp-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        IP_ADDRESS: ${{ steps.get-ip.outputs.ip_address }}
      with:
        azcliversion: latest
        inlineScript: |
          duration=1

          az functionapp config access-restriction add -g "$RESOURCE_GROUP" -n "$LOGIC_APP_NAME" --rule-name build_server --action Allow --ip-address "$IP_ADDRESS/32" --priority 250 --scm-site true >/dev/null
          az resource update -g "$RESOURCE_GROUP" -n "$LOGIC_APP_NAME" --resource-type "Microsoft.Web/sites" --set properties.publicNetworkAccess=Enabled >/dev/null

          echo "Sleeping for $duration minutes..."
          sleep "$duration"m

    - name: Package Code
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        stage="$(mktemp -d "${RUNNER_TEMP}/logicapp-package.XXXXXX")"
        archive="${RUNNER_TEMP}/logicapp-package.zip"
        cleanup() {
          rm -rf "$stage"
        }
        trap cleanup EXIT

        cp -R "$PACKAGE"/. "$stage"/
        cp "$stage/azure.parameters.json" "$stage/parameters.json"
        (cd "$stage" && zip -q -r "$archive" . -x "*.git*" "*.DS_Store" "node_modules/*" "dist/*" "*.bak")
        echo "archive=$archive" >> "$GITHUB_ENV"

    - name: Upload Foundry workflow instructions
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        storage_account="$(azd env get-value AZURE_STORAGE_ACCOUNT)"
        instructions_container="$(azd env get-value AZURE_STORAGE_INSTRUCTIONS_CONTAINER)"
        system_file="$(azd env get-value AZURE_STORAGE_SYSTEM_INSTRUCTIONS_FILE)"
        processing_file="$(azd env get-value AZURE_STORAGE_PROCESSING_INSTRUCTIONS_FILE)"
        test -n "$storage_account"
        test -n "$instructions_container"
        test -n "$system_file"
        test -n "$processing_file"

        az storage blob upload \
          --auth-mode login \
          --account-name "$storage_account" \
          --container-name "$instructions_container" \
          --name "$system_file" \
          --file "$(dirname "$PACKAGE")/instructions/system.md" \
          --content-type "text/markdown" \
          --overwrite true \
          --only-show-errors
        az storage blob upload \
          --auth-mode login \
          --account-name "$storage_account" \
          --container-name "$instructions_container" \
          --name "$processing_file" \
          --file "$(dirname "$PACKAGE")/instructions/processing.md" \
          --content-type "text/markdown" \
          --overwrite true \
          --only-show-errors

    - name: Deploy to Azure Logic App
      uses: azure/cli@v2.1.0
      env:
        LOGIC_APP_NAME: ${{ inputs.logicapp-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
      with:
        azcliversion: latest
        inlineScript: |
          echo "Deploying Logic App workflow to $LOGIC_APP_NAME in resource group $RESOURCE_GROUP..."

          az logicapp deployment source config-zip --name "$LOGIC_APP_NAME" \
                                                  --resource-group "$RESOURCE_GROUP" \
                                                  --src "${{ runner.temp }}/logicapp-package.zip"

          deploy_status=$?

          if [ $deploy_status -eq 0 ]; then
            echo "Logic App workflow deployed successfully."
          else
            echo "Failed to deploy Logic App workflow."
            exit 1
          fi

    - name: Remove Runner IP
      if: always()
      uses: azure/cli@v2.1.0
      env:
        LOGIC_APP_NAME: ${{ inputs.logicapp-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        IP_ADDRESS: ${{ steps.get-ip.outputs.ip_address }}
      with:
        azcliversion: latest
        inlineScript: |
          az functionapp config access-restriction remove -g "$RESOURCE_GROUP" -n "$LOGIC_APP_NAME" --ip-address "$IP_ADDRESS/32" --rule-name build_server --scm-site true >/dev/null
          az resource update -g "$RESOURCE_GROUP" -n "$LOGIC_APP_NAME" --resource-type "Microsoft.Web/sites" --set properties.publicNetworkAccess=Disabled >/dev/null
