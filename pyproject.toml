[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["app/backend"]
testpaths = ["app/backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["app/backend/tests"]
